plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.pvmlogs.PvmPerformancePluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.pvmlogs'

// Which build wrote a debug log (T-096): the commit, the branch, how many tracked files had uncommitted changes, the
// commit's date and the build's time, written into the build on every build so `./gradlew run` after a pull says the new
// commit. It goes under build/, never src/main: the Plugin Hub's build copies only src/main and has no such file, and the
// plugin then names the release instead. Nothing else goes in: no path, user or machine name.
def buildInfoDir = layout.buildDirectory.dir('generated/build-info')

def git = { List<String> command ->
	try
	{
		def process = new ProcessBuilder(['git'] + command).directory(projectDir).redirectErrorStream(false).start()
		process.outputStream.close()
		def out = process.inputStream.getText('UTF-8')
		process.errorStream.getText('UTF-8')
		return process.waitFor() == 0 ? out.trim() : null
	}
	catch (IOException ignored)
	{
		return null
	}
}

tasks.register('buildInfo') {
	description = 'Writes which commit this build is from into the plugin, for its debug log.'
	outputs.dir(buildInfoDir)
	// Git's state is not a Gradle input, so the file is written again on every build.
	outputs.upToDateWhen { false }
	doLast {
		def file = buildInfoDir.get().file('com/pvmlogs/build-info.properties').asFile
		file.parentFile.mkdirs()
		def commit = git(['rev-parse', '--short=7', 'HEAD'])
		if (commit == null)
		{
			// Not a git checkout, or no git: no file, rather than a stale one from an earlier build.
			file.delete()
			logger.lifecycle('buildInfo: git could not be read, so the debug log will say the build is unknown')
			return
		}
		// Changed tracked files, and new files under src/ (a new class changes the build; a note at the root doesn't).
		def status = git(['status', '--porcelain', '--untracked-files=all'])
		def lines = [
			'# Written by build.gradle (buildInfo) on every build; read by BuildInfo for the debug log.',
			'commit=' + commit,
			'branch=' + (git(['rev-parse', '--abbrev-ref', 'HEAD']) ?: ''),
			'dirtyFiles=' + (status == null ? '' : status.readLines().findAll {
				!it.trim().isEmpty() && (!it.startsWith('??') || it.substring(3).startsWith('src/'))
			}.size()),
			'commitTime=' + (git(['log', '-1', '--format=%cI', 'HEAD']) ?: ''),
			'buildTime=' + java.time.OffsetDateTime.now(java.time.ZoneOffset.UTC).withNano(0),
		]
		file.setText(lines.join('\n') + '\n', 'UTF-8')
	}
}

sourceSets.main.resources.srcDir(tasks.named('buildInfo'))

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.named('test', Test) {
	// Print each failure in full, and the totals at the end of every run, so a CI log says what ran.
	testLogging {
		events 'failed', 'skipped'
		exceptionFormat 'full'
		showExceptions true
		showCauses true
		showStackTraces true
	}
	afterSuite { suite, result ->
		if (suite.parent == null)
		{
			println "Tests: ${result.testCount} run, ${result.successfulTestCount} passed, " +
				"${result.failedTestCount} failed, ${result.skippedTestCount} skipped (${result.resultType})"
		}
	}
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	// -ea is required: ExternalPluginManager.loadBuiltin refuses to run without it.
	//
	// -da for the GPU plugin is required too, for the opposite reason. Its model sorter asserts that a face's sort
	// distance lands inside the model's own diameter, and on some models it does not - a rendering edge case that is a
	// no-op in a normal client, because assertions are off there, and a hard AssertionError on the client thread here,
	// which takes the whole dev client down mid-fight. Not ours to fix and not worth losing a trip to; the assertion is
	// only silenced for that one package, so everything -ea is actually there to catch still fires.
	jvmArgs "-ea", "-da:net.runelite.client.plugins.gpu..."
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
